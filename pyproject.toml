[project]
name = "dotdiff"
version = "0.1.0"
description = "Compare two dotenv files and see what changed. Zero dependencies, pure Python stdlib."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mahmoud Ahmed" }]

[project.scripts]
dotdiff = "dotdiff:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
